<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKILLPOP V8.1 — by BROT2YOU</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<style>
:root{
  --ink:#1D2340;--ink2:#2B3358;--muted:#626A86;--bg:#EEF1F8;--surface:#FFFFFF;--line:#DCE1EE;--soft:#F5F7FC;
  --pop:#FF4F7B;--teal:#0FA191;--violet:#7A5AF0;
  --m1:#D9434A;--m2:#E8892A;--m3:#8FB12A;--m4:#1F9460;
  --display:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#3550D8}
:focus-visible{outline:3px solid #5B8DEF;outline-offset:2px}

/* ---------- structure ---------- */
.shell{display:flex;min-height:100vh}
.side{width:228px;flex-shrink:0;background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{font-family:var(--display);font-weight:800;font-size:31px;line-height:1;letter-spacing:-1px;padding:0 10px}
.brand span{color:var(--pop)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;color:#A9B0CF;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#C3C9E4;padding:11px 12px;border-radius:12px;text-align:left;font-weight:650;position:relative}
.nav button .ic{width:22px;text-align:center;font-size:17px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.1);color:#fff}
.nav button.on:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--pop)}
.side-foot{margin-top:auto;font-size:11px;color:#8890B4;padding:0 10px}
.main{flex:1;min-width:0;padding:26px clamp(14px,3vw,40px) 48px;max-width:1280px}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.mbrand{display:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.2vw,36px);letter-spacing:-.8px;line-height:1.05;margin:0}
h2{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.3px;margin:0 0 14px;line-height:1.2}
h3{font-size:16px;margin:0 0 8px}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:650;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid #CDD4E6;border-radius:11px;padding:9px 11px;min-height:42px;font-size:16px;max-width:100%;width:100%}
.ctl .field{width:auto;min-width:150px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
select{padding-right:28px}

/* ---------- blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.panel>h2 .count{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #EDF0F7;flex-wrap:wrap}
.list-item:last-child{border-bottom:0}
.list-item.sel{background:linear-gradient(90deg,#FFF0F4,transparent 70%);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}
.note{background:#FFF7E6;border:1px solid #F1DDA8;color:#5E4A1F;border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.55}
.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.demo .btn{background:#fff;color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;min-height:42px;font-weight:750;background:var(--ink);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ink2)}
.btn.pop{background:var(--pop)}
.btn.pop:hover{background:#F03D6B}
.btn.ghost{background:#E6EAF5;color:var(--ink)}
.btn.ghost:hover{background:#DADFEE}
.btn.danger{background:#C9373F}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:6px 8px;border-radius:8px;color:#3550D8;font-weight:650;font-size:13px}
.link:hover{background:#EEF2FF}
.link.del{color:#B3363D}
.link.del:hover{background:#FFF0F0}

/* ---------- mastery ---------- */
.chip{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;font-weight:800;color:#fff;font-size:14px}
.chip.l1,.lvlbtn.l1,.seg.l1{background:var(--m1)}
.chip.l2,.lvlbtn.l2,.seg.l2{background:var(--m2)}
.chip.l3,.lvlbtn.l3,.seg.l3{background:var(--m3)}
.chip.l4,.lvlbtn.l4,.seg.l4{background:var(--m4)}
.chip.none{background:#EEF1F7;color:#A2A9C0}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px 4px 4px;font-size:12.5px;font-weight:700;background:var(--soft)}
.pill .chip{width:22px;height:22px;border-radius:999px;font-size:12px}
.pill.none{padding:4px 11px;color:var(--muted);font-weight:600}
.lvlbtns{display:flex;gap:7px}
.lvlbtn{width:44px;height:44px;border-radius:12px;border:3px solid transparent;color:#fff;font-weight:800;font-size:16px;opacity:.38;transition:opacity .12s,transform .12s}
.lvlbtn:hover{opacity:.75}
.lvlbtn.on{opacity:1;border-color:var(--ink);transform:scale(1.06)}
.legend{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:center;background:var(--surface);border:2px solid var(--ink);border-radius:24px;padding:22px 26px;margin-bottom:22px;box-shadow:7px 7px 0 var(--ink)}
.hero h2{font-size:clamp(26px,3vw,34px);margin:0}
.hero .meta{color:var(--muted);margin:4px 0 18px}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.fig{background:var(--soft);border-radius:14px;padding:12px}
.fig b{display:block;font-family:var(--display);font-size:28px;line-height:1.1}
.fig span{font-size:12.5px;color:var(--muted)}
.dist{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#EEF1F7;margin:8px 0 10px}
.seg{height:100%}
.radar{display:block;width:100%;max-width:470px;height:auto;margin:0 auto}

/* ---------- bars ---------- */
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.track{height:12px;background:#EEF1F7;border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.bar b{text-align:right}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #EDF0F7;font-size:13.5px;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:650;background:var(--soft)}
th .sk{display:block;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
td.name{font-weight:700;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#FAFBFF}
.grid-table td:not(.name){text-align:center}
.grid-table th:not(:first-child){text-align:center}

/* ---------- tabs / student ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pop)}
.stepper{display:flex;gap:6px;align-items:flex-end}
.stepper .btn{padding:0 12px}
.skill-axis{display:inline-block;font-size:12px;font-weight:700;color:#3550D8;background:#EEF2FF;border-radius:7px;padding:2px 8px;margin-bottom:5px}
.obs p{margin:6px 0 0;white-space:pre-wrap}
.advice{background:#F0FBF8;border:1px solid #BDE8DE;border-radius:16px;padding:18px;margin:16px 0}
.advice p{font-size:17px;margin:8px 0 0;line-height:1.55}

/* ---------- bilans ---------- */
.bilan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.bilan-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
.bilan-head h3{font-family:var(--display);font-size:22px;margin:0}
.bilan .cols{align-items:start}
.bilan .radar{max-width:330px}
.bilan ul{list-style:none;margin:0;padding:0}
.bilan li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #EDF0F7;font-size:13px}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(20,24,46,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.modal-box .field{margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.span2{grid-column:span 2}
@media (max-width:560px){.span2{grid-column:auto}}
.ctl{align-items:flex-end}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{min-height:42px;padding:9px 13px;font-size:14px}
/* écran de verrouillage */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--ink)}
.auth-box{background:#fff;border-radius:24px;padding:28px;width:100%;max-width:430px;border:2px solid var(--ink);box-shadow:8px 8px 0 var(--pop)}
.auth-brand{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-1px;line-height:1;margin-bottom:22px}
.auth-brand span{color:var(--pop)}
.auth-brand small{display:block;font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:6px}
.auth-box h2{font-size:24px;margin-bottom:8px}
.auth-box p{margin:0 0 14px;line-height:1.5}
.auth-box .field{margin-bottom:12px}
.auth-warn{background:#FFF7E6;border:1px solid #F1DDA8;color:#5E4A1F;border-radius:12px;padding:10px 12px;font-size:13px}
.btn.wide{width:100%;min-height:48px;font-size:16px}
.showpw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:-4px 0 14px}
.showpw input{width:auto;min-height:0}
.auth-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
.auth-msg{color:#B3363D;font-weight:650;font-size:14px;min-height:1px;margin:12px 0 0!important}
.auth-foot{margin:14px 0 0!important;text-align:center}
.print-title{display:none}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .side{width:76px;padding:20px 8px}
  .brand{font-size:15px;padding:0;text-align:center}
  .brand span{display:block}
  .brand small,.nav .tx,.side-foot{display:none}
  .nav button{justify-content:center;padding:12px 0}
  .nav button.on:before{left:-8px}
  .hero{grid-template-columns:1fr}
}
@media (max-width:760px){
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:30;gap:0;overflow:visible}
  .brand{display:none}
  .nav{flex-direction:row;width:100%;gap:0}
  .nav button{flex:1;flex-direction:column;gap:1px;padding:7px 0 5px;font-size:10px;border-radius:10px;min-width:0}
  .nav .tx{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nav button.on:before{left:30%;right:30%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .main{padding:14px 12px 96px}
  .mbrand{display:block;font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:2px}
  .mbrand span{color:var(--pop)}
  .ctl{width:100%}
  .ctl .field{flex:1;min-width:0}
  .ctl .tools{width:100%}
  .ctl .tools .btn{flex:1}
  .cols{grid-template-columns:minmax(0,1fr)}
  .hero{padding:16px;box-shadow:5px 5px 0 var(--ink);border-radius:20px}
  .figs{gap:7px}
  .fig b{font-size:23px}
  .panel{padding:15px;border-radius:16px}
  .bar{grid-template-columns:96px minmax(0,1fr) 30px;font-size:12px}
  .lvlbtn{width:40px;height:40px}
  .res{display:none}
  .toast{bottom:86px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  .side,.topbar .ctl,.noprint,.toast,.modal,.demo{display:none!important}
  .main{padding:0;max-width:none}
  .topbar{display:none}
  .print-title{display:block;font-family:var(--display);font-size:13px;color:#555;margin-bottom:8px}
  .bilan{border:0;padding:0;border-radius:0;break-after:page;page-break-after:always}
  .bilan:last-child{break-after:auto;page-break-after:auto}
  .print-one .bilan{display:none}
  .print-one .bilan.target{display:block}
  .chip,.seg,.track i,.lvlbtn{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  save(); ensureStudent(); render();

/* ---------- Conseils ---------- */
function band(){ var c = cls(); return c && (c.grade === '6e' || c.grade === '5e') ? 'c1' : 'c2'; }
function adviceItems(){ var e = ADVICE[advice.axis]; if (!e) return []; var l = e[band()] || e.all || []; return l[advice.level - 1] || []; }
function adviceText(){
  var items = adviceItems(); if (!items.length) return '';
  var base = items[advice.index % items.length], low = lowerFirst(base);
  if (advice.style === 'Famille') return 'Pour progresser, il est conseillé ' + (/^[aeiouyhéèêàâîôû]/i.test(low) ? 'd’' : 'de ') + low;
  if (advice.style === 'Bilan') return 'Piste de progression : ' + low;
  return 'Ton objectif : ' + low;
}
function adviceFor(sid){ studentId = sid; go('conseils'); fromProfile(true); }
function fromProfile(silent){
  var s = student(); if (!s) return;
  var vals = axisValues(s.id), best = -1;
  vals.forEach(function(v, i){ if (v && (best < 0 || v < vals[best])) best = i; });
  if (best < 0) { if (!silent) toast('Aucune compétence évaluée pour cet élève sur cette période.'); render(); return; }
  advice.axis = CFG.axes[best]; advice.level = Math.min(4, Math.max(1, Math.floor(vals[best] + 0.5))); advice.index = 0; adviceDraft = null;
  render(); toast('Point d’appui : ' + CFG.axes[best].toLowerCase() + ', niveau ' + advice.level);
}
function setAdvice(k, v){ advice[k] = v; if (k !== 'style') advice.index = 0; adviceDraft = null; render(); }
function pageConseils(){
  var c = cls(); if (!c) return noClass();
  ensureStudent(); var s = student(), txt = adviceText(), shown = adviceDraft == null ? txt : adviceDraft;
  var axes = Object.keys(ADVICE);
  var h = panel('Choisir un conseil', '<div class="between" style="align-items:flex-end;margin-bottom:14px">' + (s ? studentPicker() : '<span class="muted">Aucun élève dans la classe.</span>') + (s ? '<button class="btn ghost" type="button" onclick="fromProfile(false)">Partir du profil de ' + esc(dn(s).split(' ')[0]) + '</button>' : '') + '</div>' +
    '<div class="form">' + field('Domaine', '<select onchange="setAdvice(\'axis\',this.value)">' + options(axes, advice.axis) + '</select>') +
    field('Niveau de maîtrise', '<select onchange="setAdvice(\'level\',Number(this.value))">' + options(CFG.labels.map(function(l, i){ return [String(i + 1), (i + 1) + ', ' + l]; }), String(advice.level)) + '</select>') +
    field('Formulation', '<select onchange="setAdvice(\'style\',this.value)">' + options([['Élève', 'Pour l’élève'], ['Famille', 'Pour la famille'], ['Bilan', 'Pour un bilan']], advice.style) + '</select>') + '</div>' +
    '<div class="advice"><div class="between"><b>Conseil adapté à la ' + esc(c.grade) + '</b>' + pill(advice.level) + '</div><p>' + esc(txt) + '</p></div>' +
    '<div class="row"><button class="btn ghost" type="button" onclick="advice.index++;adviceDraft=null;render()">Autre suggestion</button><button class="btn" type="button" onclick="copyText(adviceText())">Copier</button></div>');
  h += panel('Adapter et enregistrer', field('Ta version', '<textarea id="advice-edit" oninput="adviceDraft=this.value">' + esc(shown) + '</textarea>') +
    '<div class="row" style="margin-top:10px"><button class="btn ghost" type="button" onclick="copyText($(\'advice-edit\').value)">Copier ma version</button>' +
    (s ? '<button class="btn pop" type="button" onclick="saveAdvice()">Ajouter aux observations de ' + esc(dn(s)) + '</button>' : '') + '</div>' +
    '<p class="tiny">Le conseil est enregistré dans l’onglet Observations de l’élève, avec la date du jour. Vérifie qu’il correspond à la situation réelle.</p>');
  return h;
}
function saveAdvice(){
  var s = student(), body = $('advice-edit').value.trim();
  if (!s || !body) { toast('Le conseil est vide.'); return; }
  confirmBox('Enregistrer ce conseil ?', 'Il sera ajouté aux observations de <b>' + esc(dn(s)) + '</b>.', 'Enregistrer', false, function(){
    db.notes.push({ id: uid(), studentId: s.id, date: today(), category: 'Conseil, ' + advice.axis.toLowerCase(), body: body });
    save(); render(); toast('Conseil ajouté au dossier de ' + dn(s));
  });
}
function copyText(txt){
  function fallback(){
    var t = document.createElement('textarea'); t.value = txt; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.top = '-1000px';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, txt.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(t); toast(ok ? 'Texte copié' : 'Copie impossible : sélectionne le texte à la main.');
  }
  if (!txt) { toast('Rien à copier.'); return; }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function(){ toast('Texte copié'); }, fallback);
  else fallback();
}

    '<p class="tiny">Les sauvegardes déjà exportées gardent l’ancien mot de passe.</p><p class="auth-msg" id="m-err" role="alert"></p>',
    onOk: function(){
      var cur = $('cp-cur').value, n1 = $('cp-n1').value, err = checkNewPw(n1, $('cp-n2').value);
      if (err) { modalError(err); return false; }
      $('m-ok').disabled = true; $('m-err').textContent = 'Vérification…';
      var salt = randomBytes(16);
      saveChain = (saveChain || Promise.resolve()).then(function(){ return verifyPassword(cur); }).then(function(ok){
        if (!ok) throw new Error('bad');
        return deriveKey(n1, salt, ITER).then(function(key){ return writeVault(JSON.stringify(db), key, salt, ITER).then(function(){ cryptoKey = key; vaultSalt = salt; vaultIter = ITER; }); });
      });
      saveChain.then(function(){ $('m-ok').disabled = false; closeModal(); toast('Mot de passe changé'); }, function(e){ modalError(e && e.message === 'bad' ? 'Mot de passe actuel incorrect.' : 'Le changement a échoué.'); });
      saveChain = saveChain.then(null, function(){});
      return false;
    } });
}
function exportEncrypted(){
  db.lastExport = today();
  var text = JSON.stringify(db);
  seal(text, cryptoKey, vaultSalt, vaultIter, 'skillpop-backup').then(function(env){
    env.exportedAt = today();
    download('skillpop-sauvegarde-chiffree-' + today() + '.json', JSON.stringify(env), 'application/json');
    save(); render(); toast('Sauvegarde chiffrée exportée');
  }, function(){ toast('L’export a échoué.'); });
}
function exportPlain(){
  confirmBox('Exporter sans chiffrement ?', 'Le fichier sera lisible par toute personne qui l’ouvre : noms, niveaux et observations en clair. Réserve cet export à un transfert ponctuel et supprime le fichier ensuite.', 'Exporter en clair', true, function(){
    db.lastExport = today();
    download('skillpop-sauvegarde-NON-CHIFFREE-' + today() + '.json', JSON.stringify(db, null, 2), 'application/json');
    save(); render(); toast('Sauvegarde non chiffrée exportée');
  });
}
function importJSON(input){
  var file = input.files && input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var x = null; try { x = JSON.parse(reader.result); } catch (e) { x = null; }
    input.value = '';
    if (isEnvelope(x)) {
      openModal({ title: 'Sauvegarde chiffrée', ok: 'Importer', danger: true, html: '<p>Saisis le mot de passe utilisé au moment de l’export. Les données actuelles seront remplacées, puis chiffrées avec ton mot de passe actuel.</p>' + field('Mot de passe de la sauvegarde', '<input type="password" id="ip-pass" autocomplete="off">') + '<p class="auth-msg" id="m-err" role="alert"></p>', onOk: function(){
        $('m-ok').disabled = true; $('m-err').textContent = 'Déchiffrement…';
        deriveKey($('ip-pass').value, unb64(x.salt), x.iter).then(function(key){ return openEnvelope(x, key); }).then(function(obj){
          var m = migrate(obj); if (!m) throw new Error('format');
          $('m-ok').disabled = false; closeModal(); db = m; resetState(); save(); go('accueil'); toast('Sauvegarde importée');
        }, function(){ modalError('Mot de passe incorrect pour cette sauvegarde.'); });
        return false;
      } });
      return;
    }
    var m = null; try { m = migrate(x); } catch (e3) { m = null; }
    if (!m) { toast('Ce fichier n’est pas une sauvegarde SkillPop.'); return; }
    confirmBox('Remplacer les données actuelles ?', 'La sauvegarde contient ' + plural(m.classes.length, 'classe', 'classes') + ' et ' + plural(m.students.length, 'élève', 'élèves') + '. Elle sera chiffrée avec ton mot de passe actuel.', 'Importer', true, function(){
      db = m; resetState(); save(); go('accueil'); toast('Sauvegarde importée et chiffrée');
    });
  };
  reader.readAsText(file);
}
function isIOS(){ var ua = navigator.userAgent || ''; return /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function daysSince(d){ if (!isDate(d)) return -1; var a = new Date(d + 'T00:00:00'), b = new Date(today() + 'T00:00:00'); return Math.round((b - a) / 86400000); }
function backupBanner(){
  if (db.demo || !db.students.length) return '';
  var n = daysSince(db.lastExport);
  if (n >= 0 && n <= 7) return '';
  return '<div class="demo noprint"><span>' + (n < 0 ? 'Aucune sauvegarde exportée pour l’instant.' : 'Dernière sauvegarde il y a ' + n + ' jours.') + (isIOS() && !navigator.standalone ? ' Sur iPhone et iPad, Safari peut effacer les données d’un site non ouvert depuis 7 jours : ajoute SkillPop à l’écran d’accueil.' : '') + '</span><button class="btn" type="button" onclick="exportEncrypted()">Exporter une sauvegarde chiffrée</button></div>';
}
function dn(s){ if (!s) return ''; if (db && db.settings && db.settings.hideNames) return s.name.split(' ').filter(function(w){ return w; }).map(function(w){ return w.charAt(0).toUpperCase() + '.'; }).join(' '); return s.name; }
function toggleNames(){ db.settings = db.settings || {}; db.settings.hideNames = !db.settings.hideNames; save(); render(); toast(db.settings.hideNames ? 'Noms masqués : initiales seulement' : 'Noms affichés'); }

/* ---------- rendu ---------- */
var TITLES = { accueil: 'Accueil', classes: 'Classes et élèves', referentiel: 'Référentiel', evaluer: 'Évaluer', eleves: 'Dossier élève', conseils: 'Conseils', bilans: 'Bilans', reglages: 'Réglages' };
var VIEWS = { accueil: pageAccueil, classes: pageClasses, referentiel: pageReferentiel, evaluer: pageEvaluer, eleves: pageEleves, conseils: pageConseils, bilans: pageBilans, reglages: pageReglages };
function render(){
  if (!db) return;
  if (!db.settings) db.settings = { hideNames: false };
  if (!byId(db.classes, classId)) classId = db.classes[0] ? db.classes[0].id : '';
  if (period !== 'Année entière' && periodNames().indexOf(period) < 0) period = 'Année entière';
  if (comparison !== 'Aucune' && periodNames().indexOf(comparison) < 0) comparison = 'Aucune';
  ensureStudent(); indexRatings(); nav();
  $('heading').textContent = TITLES[page];
  $('topctl').innerHTML = topControls();
  $('view').innerHTML = demoBanner() + backupBanner() + (VIEWS[page] || pageAccueil)();
  document.title = TITLES[page] + ' — SKILLPOP V8.1';
}
function boot(){
  if (!cryptoReady()) { showAuth('nocrypto'); return; }
  if (readVault()) { showAuth('unlock'); return; }
  pendingPlain = loadLegacyPlain();
  showAuth('setup');
}
boot();
</script>
