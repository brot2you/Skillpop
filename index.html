function classes(){return card('Mes classes',`<div class="grid">${db.classes.map(c=>`<div class="card" style="margin:0"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.subject)} • ${esc(c.grade)} • ${esc(c.year)}</p><p>${db.students.filter(s=>s.classId===c.id).length} élèves</p><button class="btn alt" onclick="setClass('${c.id}');go('Élèves')">Ouvrir la classe</button></div>`).join('')}</div>`)+card('Ajouter une classe',`<form onsubmit="addClass(event)" class="formgrid">${field('Nom',`<input name="name" required placeholder="4e C" maxlength="40">`)}${field('Niveau',`<select name="grade">${Object.keys(descriptors).map(g=>`<option>${g}</option>`).join('')}</select>`)}${field('Discipline',`<input name="subject" value="Anglais" required maxlength="70">`)}<div class="field"><label>Action</label><button class="btn mint">+ Ajouter</button></div></form>`)+card('Élèves de la classe',`<div class="toolbar">${classSelector()}</div>${db.students.filter(s=>s.classId===classId).map(s=>`<div class="item split"><strong>${esc(s.name)}</strong><button class="smallbtn" onclick="studentId='${s.id}';go('Élèves')">Voir le dossier</button></div>`).join('')||'<div class="empty">Aucun élève</div>'}<form onsubmit="addStudent(event)" class="toolbar" style="margin-top:15px">${field('Ajouter un élève fictif',`<input name="name" required placeholder="Prénom Nom" maxlength="80">`)}<button class="btn mint">Ajouter</button></form>`)}
function refs(){let c=cls(),skills=db.skills.filter(k=>k.subject===c?.subject&&(k.grade===c?.grade||!k.grade));return `<div class="toolbar">${classSelector()}</div>${card('Référentiel • '+esc(c?.subject||'')+' • '+esc(c?.grade||''),`<div class="notice">Les descripteurs préchargés sont des <b>repères pédagogiques de démonstration</b>, inspirés des activités langagières du CECRL, et non des citations officielles certifiées. Vérifie et adapte-les aux programmes en vigueur, aux attendus et à la langue étudiée. Repères indicatifs : ${esc(levels[c?.grade]||'à configurer')}.</div>${skills.map(k=>`<div class="item"><span class="pill" style="background:#e9efff;color:#315de0">${esc(k.axis)}</span><div style="margin-top:8px"><strong>${esc(k.name)}</strong></div><div class="mini">${esc(k.origin||'Compétence personnalisée')}</div></div>`).join('')||'<div class="empty">Aucune compétence pour cette discipline</div>'}`)}${card('Créer une compétence personnalisée',`<form onsubmit="addSkill(event)" class="formgrid">${field('Activité / domaine',`<select name="axis">${AXES.concat(['Médiation','Compétences culturelles','Autre']).map(a=>`<option>${a}</option>`).join('')}</select>`)}${field('Descripteur observable',`<input name="name" required maxlength="220" placeholder="Ex. Identifier les informations essentielles">`)}<div><button class="btn mint">+ Ajouter au référentiel</button></div></form>`)}`}
function evaluate(){let arr=assessments(),a=arr.find(x=>x.id===assessmentId)||arr.at(-1);if(a)assessmentId=a.id;let students=db.students.filter(s=>s.classId===classId),skills=db.skills.filter(k=>k.subject===cls()?.subject&&(k.grade===cls()?.grade||!k.grade));return card('Évaluation express • maîtrise en couleurs',`<div class="toolbar">${classSelector()}${periodSelector()}${field('Évaluation',`<select onchange="assessmentId=this.value;render()">${arr.map(a=>`<option value="${a.id}" ${a.id===assessmentId?'selected':''}>${esc(a.title)} • ${a.date}</option>`).join('')}</select>`)}</div><div class="levels">${LABELS.map((l,i)=>`<span class="pill" style="background:${COLORS[i]}1c;color:${COLORS[i]}">${i+1} ${l}</span>`).join('')}</div>${a?`<p><b>${esc(skill(a.skillId)?.name||'Compétence')}</b> <span class="mini">• ${a.date}</span></p><div class="tablewrap"><table><thead><tr><th>Élève</th><th>Attribuer le niveau</th><th>Résultat</th></tr></thead><tbody>${students.map(s=>`<tr><td>${esc(s.name)}</td><td><div class="levels">${COLORS.map((c,i)=>`<button title="${LABELS[i]}" aria-label="${LABELS[i]}" class="level ${rating(s.id,a.id)===i+1?'selected':''}" style="background:${c}" onclick="rate('${s.id}','${a.id}',${i+1})">${i+1}</button>`).join('')}</div></td><td>${level(rating(s.id,a.id))}</td></tr>`).join('')}</tbody></table></div><p class="mini">Clique une seconde fois sur le niveau sélectionné pour effacer l’évaluation.</p>`:'<div class="empty">Aucune évaluation pour cette période. Crée-en une ci-dessous.</div>'}`)+card('Créer une évaluation',`<form class="formgrid" onsubmit="addAssessment(event)">${field('Titre',`<input name="title" required maxlength="120" placeholder="Ex. Comprendre un dialogue">`)}${field('Compétence du référentiel',`<select name="skillId" required>${skills.map(k=>`<option value="${k.id}">${esc(k.axis)} — ${esc(k.name)}</option>`).join('')}</select>`)}${field('Date',`<input name="date" type="date" value="2026-11-07" required>`)}<div class="field"><label>Action</label><button class="btn mint" ${skills.length?'':'disabled'}>+ Créer</button></div></form>`) }
function results(){let students=db.students.filter(s=>s.classId===classId),used=db.skills.filter(k=>assessments(classId).some(a=>a.skillId===k.id));return `<div class="toolbar">${classSelector()}${periodSelector()}${studentSelector()}${compSelector()}</div>${card('◈ Diagramme radar individuel',studentId?chart(studentId):'<div class="empty">Aucun élève</div>')}${card('Grille de maîtrise • classe',`<div class="tablewrap"><table><thead><tr><th>Élève</th>${used.map(k=>`<th title="${esc(k.name)}">${esc(k.axis)}</th>`).join('')}</tr></thead><tbody>${students.map(s=>`<tr><td>${esc(s.name)}</td>${used.map(k=>`<td>${level(latest(s.id,k.id))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)}${card('Répartition des niveaux • résultats saisis',`<div class="grid">${LABELS.map((l,i)=>{let n=assessments().flatMap(a=>students.map(s=>rating(s.id,a.id))).filter(v=>v===i+1).length;return `<div class="stat"><span class="muted">${esc(l)}</span><strong style="color:${COLORS[i]}">${n}</strong></div>`}).join('')}</div>`)}`}
function pupils(){let students=db.students.filter(s=>s.classId===classId),s=student();return `<div class="toolbar">${classSelector()}${studentSelector()}${periodSelector()}${compSelector()}</div>${s?card('Dossier • '+esc(s.name),`<div class="tabs"><button class="${studentTab==='radar'?'active':''}" onclick="studentTab='radar';render()">Radar</button><button class="${studentTab==='historique'?'active':''}" onclick="studentTab='historique';render()">Historique</button><button class="${studentTab==='notes'?'active':''}" onclick="studentTab='notes';render()">Observations</button></div>${studentTab==='radar'?chart(s.id):studentTab==='historique'?assessments().map(a=>`<div class="item split"><div><b>${esc(a.title)}</b><div class="mini">${a.date} • ${esc(skill(a.skillId)?.name)}</div></div>${level(rating(s.id,a.id))}</div>`).join('')||'<div class="empty">Aucune évaluation</div>':db.notes.filter(n=>n.studentId===s.id&&inPeriod(n.date)).map(n=>`<div class="item"><b>${esc(n.category)}</b> <span class="mini">${n.date} • ${esc(n.scope)}</span><p>${esc(n.body)}</p></div>`).join('')||'<div class="empty">Aucune observation</div>'}`):card('Dossier',`<div class="empty">Ajoute un élève</div>`)}`}
function pp(){let students=db.students.filter(s=>s.classId===classId),s=student();return `<div class="toolbar">${classSelector()}${studentSelector()}${periodSelector()}</div>${card('Suivi professeur principal',`<p class="muted">Observations factuelles et datées, séparées des niveaux de maîtrise disciplinaire.</p>${s?`<h3>${esc(s.name)}</h3><form onsubmit="addNote(event)">${field('Catégorie',`<select name="category">${['Travail','Autonomie','Participation','Organisation','Progrès','Accompagnement','Entretien'].map(x=>`<option>${x}</option>`).join('')}</select>`)}${field('Observation',`<textarea name="body" maxlength="2500" required placeholder="Faits observés, contexte, progrès, pistes d’accompagnement..."></textarea>`)}<div style="margin-top:12px"><button class="btn mint">+ Ajouter une observation</button></div></form>`:''}`)}${card('Historique des observations',s?db.notes.filter(n=>n.studentId===s.id&&inPeriod(n.date)).map(n=>`<div class="item"><div class="split"><b>${esc(n.category)}</b><span class="mini">${n.date}</span></div><p>${esc(n.body)}</p><button class="smallbtn" onclick="removeNote('${n.id}')">Supprimer</button></div>`).join('')||'<div class="empty">Aucune observation</div>':'<div class="empty">Sélectionne un élève</div>')}`}
function bilans(){let students=db.students.filter(s=>s.classId===classId);return `<div class="toolbar">${classSelector()}${periodSelector()}<button class="btn alt" onclick="exportCSV()">Exporter CSV</button><button class="btn alt" onclick="window.print()">Imprimer / PDF</button></div>${card('Bilans • '+esc(cls()?.name||'')+' • '+esc(period),students.map(s=>`<div class="item"><div class="split"><h3>${esc(s.name)}</h3><span class="pill" style="background:#e9efff;color:#315de0">${esc(period)}</span></div><div class="grid"><div>${radar(axisValues(s.id))}</div><div>${db.skills.filter(k=>assessments().some(a=>a.skillId===k.id)).map(k=>`<p class="mini">${esc(k.name)} : ${level(latest(s.id,k.id))}</p>`).join('')||'<p class="mini">Aucun résultat</p>'}<p class="mini">${esc(db.notes.filter(n=>n.studentId===s.id&&inPeriod(n.date)).at(-1)?.body||'Aucune observation pour cette période')}</p></div></div></div>`).join('')||'<div class="empty">Aucun élève</div>')}`}
function settings(){return card('Calendrier des périodes',`${field('Organisation',`<select onchange="mode(this.value)"><option value="trimestre" ${db.periodMode==='trimestre'?'selected':''}>3 trimestres</option><option value="semestre" ${db.periodMode==='semestre'?'selected':''}>2 semestres</option></select>`)}<div class="formgrid" style="margin-top:14px">${db.dates.map((d,i)=>field(i===0?'Début année':i===db.dates.length-1?'Fin année':'Début période '+(i+1),`<input type="date" value="${d}" onchange="setDate(${i},this.value)">`)).join('')}</div><p class="mini">La date de fin est exclusive. Les filtres s'appliquent réellement aux résultats, radars et bilans.</p>`)+card('Confidentialité et sécurité',`<div class="notice"><b>Mode démonstration : aucune donnée nominative réelle.</b> Les données sont enregistrées en clair dans le stockage local du navigateur. Cette application n’a ni compte utilisateur, ni contrôle d’accès, ni chiffrement. Elle ne constitue pas une solution conforme pour les dossiers scolaires réels.</div><p>Pour un usage institutionnel : validation par l’établissement et son DPD, hébergement autorisé, authentification forte, chiffrement, gestion des habilitations, politique de conservation et sauvegardes sécurisées.</p><div class="toolbar"><button class="btn alt" onclick="exportJSON()">Exporter JSON</button><label class="btn alt" style="cursor:pointer">Importer JSON <input class="hide" type="file" accept=".json,application/json" onchange="importJSON(event)"></label><button class="btn danger" onclick="reset()">Réinitialiser la démonstration</button></div>`)+card('Références pédagogiques',`<p>Les référentiels intégrés sont des exemples de formulation, à personnaliser et vérifier à partir des programmes en vigueur par niveau et année scolaire. Les niveaux de maîtrise 1–4 ne sont pas des niveaux CECRL.</p><p><a href="https://eduscol.education.gouv.fr/" target="_blank" rel="noopener">Éduscol</a> • <a href="https://www.education.gouv.fr/bo" target="_blank" rel="noopener">Bulletin officiel</a> • <a href="https://www.coe.int/en/web/common-european-framework-reference-languages" target="_blank" rel="noopener">CECRL</a></p>`) }
function render(){$('#heading').textContent=page+' ✦';$('#view').innerHTML=({'Accueil':home,'Mes classes':classes,'Référentiel':refs,'Évaluer':evaluate,'Résultats':results,'Élèves':pupils,'Prof principal':pp,'Bilans':bilans,'Paramètres':settings}[page]||home)()}
function addClass(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim(),grade=String(f.get('grade')),subject=String(f.get('subject')).trim();if(!name||!subject)return;let c={id:uid(),name,grade,subject,year:'2026-2027'};db.classes.push(c);classId=c.id;studentId='';save();render()}
function addStudent(e){e.preventDefault();let name=String(new FormData(e.target).get('name')).trim();if(!name)return;let s={id:uid(),name,classId};db.students.push(s);studentId=s.id;save();render()}
function addSkill(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;db.skills.push({id:uid(),name,axis:String(f.get('axis')),subject:cls()?.subject,grade:cls()?.grade,origin:'Personnalisée',official:false});save();render()}
function addAssessment(e){e.preventDefault();let f=new FormData(e.target),title=String(f.get('title')).trim(),skillId=String(f.get('skillId')),date=String(f.get('date'));if(!title||!skill(skillId)||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;let a={id:uid(),classId,skillId,date,title};db.assessments.push(a);assessmentId=a.id;period='Année entière';save();render()}
function rate(s,a,v){let old=db.ratings.find(r=>r.studentId===s&&r.assessmentId===a);if(old){if(old.value===v)db.ratings=db.ratings.filter(r=>r!==old);else old.value=v}else db.ratings.push({id:uid(),studentId:s,assessmentId:a,value:v});save();render()}
function addNote(e){e.preventDefault();if(!student())return;let f=new FormData(e.target),body=String(f.get('body')).trim();if(!body)return;db.notes.push({id:uid(),studentId,body,category:String(f.get('category')),scope:'pp',date:new Date().toISOString().slice(0,10)});save();render()}
function removeNote(id){if(confirm('Supprimer cette observation ?')){db.notes=db.notes.filter(n=>n.id!==id);save();render()}}
function mode(m){db.periodMode=m;db.dates=m==='semestre'?['2026-09-01','2027-02-01','2027-09-01']:['2026-09-01','2027-01-01','2027-04-01','2027-09-01'];period='Année entière';comparison='Aucune';save();render()}
function setDate(i,v){let d=[...db.dates];d[i]=v;if(d.some((x,j)=>j&&x<=d[j-1])){alert('Les dates doivent être strictement croissantes.');render();return}db.dates=d;save();render()}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportJSON(){download('skillpop-demo-sauvegarde.json',JSON.stringify(db,null,2),'application/json')}
function exportCSV(){let students=db.students.filter(s=>s.classId===classId),skills=db.skills.filter(k=>assessments().some(a=>a.skillId===k.id)),rows=[['Élève','Classe','Période',...skills.map(k=>k.name)],...students.map(s=>[s.name,cls()?.name,period,...skills.map(k=>latest(s.id,k.id)||'')])];download('skillpop-bilan-demo.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(e){let file=e.target.files?.[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!x||!['classes','students','skills','assessments','ratings','notes','dates'].every(k=>Array.isArray(x[k]))||!['trimestre','semestre'].includes(x.periodMode))throw Error('format');if(!confirm('Remplacer les données de démonstration ?'))return;db=x;classId=db.classes[0]?.id||'';studentId=db.students.find(s=>s.classId===classId)?.id||'';save();go('Accueil')}catch{alert('Fichier non reconnu.')}}function reset(){if(confirm('Effacer les données de démonstration et recommencer ?')){db=structuredClone(seed);classId='c1';studentId='s1';save();go('Accueil')}}nav();render();
</script></body></html>
