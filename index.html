'use strict';const NAV=[['Accueil','⌂'],['Mes classes','▦'],['Compétences','✦'],['Évaluer','★'],['Résultats','▥'],['Élèves','♙'],['Prof principal','♡'],['Bilans','▤'],['Paramètres','⚙']];const STORE='skillpop-v2';const seed={version:2,classes:[{id:'c1',name:'5e B',discipline:'Anglais',year:'2026–2027'},{id:'c2',name:'4e A',discipline:'Anglais',year:'2026–2027'}],students:[{id:'s1',name:'Camille Martin',classId:'c1'},{id:'s2',name:'Alex Bernard',classId:'c1'},{id:'s3',name:'Sam Dupont',classId:'c1'},{id:'s4',name:'Lina Petit',classId:'c2'}],skills:[{id:'k1',name:'Comprendre un document oral',discipline:'Anglais',domain:'Compréhension'},{id:'k2',name:'S’exprimer à l’écrit',discipline:'Anglais',domain:'Production'},{id:'k3',name:'Interagir à l’oral',discipline:'Anglais',domain:'Interaction'},{id:'k4',name:'Organiser son travail',discipline:'Transversal',domain:'Méthodologie'}],assessments:[{id:'a1',classId:'c1',skillId:'k1',title:'Listening challenge',date:'2026-10-08'},{id:'a2',classId:'c1',skillId:'k1',title:'Listening checkpoint',date:'2026-11-05'},{id:'a3',classId:'c1',skillId:'k2',title:'My daily routine',date:'2026-10-22'}],ratings:[{id:'r1',assessmentId:'a1',studentId:'s1',value:2},{id:'r2',assessmentId:'a2',studentId:'s1',value:4},{id:'r3',assessmentId:'a3',studentId:'s1',value:3},{id:'r4',assessmentId:'a2',studentId:'s2',value:3},{id:'r5',assessmentId:'a2',studentId:'s3',value:4}],notes:[{id:'n1',studentId:'s1',category:'Progrès',body:'Progrès réguliers en compréhension orale. Encourager la prise de parole.',date:'2026-11-05',scope:'pp'}],periods:['Trimestre 1','Trimestre 2','Trimestre 3'],settings:{starLabels:['Découverte','En cours','Satisfaisant','Très bien','Expert']}};const copy=x=>JSON.parse(JSON.stringify(x));let db;try{db=JSON.parse(localStorage.getItem(STORE))||copy(seed)}catch{db=copy(seed)};function valid(x){return x&&['classes','students','skills','assessments','ratings','notes'].every(k=>Array.isArray(x[k]))}if(!valid(db))db=copy(seed);let page='Accueil',currentClass=db.classes[0]?.id||'',currentStudent=db.students[0]?.id||'',currentAssessment=db.assessments[0]?.id||'',currentSkill=db.skills[0]?.id||'',period='Trimestre 1',studentTab='competences';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2);const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(db))}catch{alert('Stockage local indisponible. Exportez vos données.')}};const options=(items,sel)=>items.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');const cl=id=>db.classes.find(x=>x.id===id);const sk=id=>db.skills.find(x=>x.id===id);const st=id=>db.students.find(x=>x.id===id);const assessmentsFor=(classId,skillId)=>db.assessments.filter(a=>(!classId||a.classId===classId)&&(!skillId||a.skillId===skillId)).sort((a,b)=>a.date.localeCompare(b.date));const rating=(studentId,assessmentId)=>db.ratings.find(r=>r.studentId===studentId&&r.assessmentId===assessmentId)?.value||0;const latest=(studentId,skillId)=>{const arr=assessmentsFor(st(studentId)?.classId,skillId);for(let i=arr.length-1;i>=0;i--){let v=rating(studentId,arr[i].id);if(v)return v}return 0};const stars=(v,action='',s='',a='')=>`<span class="stars" aria-label="${v?esc(v)+' étoiles sur 5':'Non évalué'}">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=v?'on':''}" ${action?`onclick="rate('${s}','${a}',${n})"`:'disabled'} aria-label="${n} étoiles">★</button>`).join('')}</span>`;const panel=(title,body)=>`<section class="panel"><h3>${title}</h3>${body}</section>`;const empty=t=>`<div class="empty">✦ ${t}</div>`;const stat=(label,val,icon,color,bg)=>`<div class="stat"><div class="icon" style="background:${bg};color:${color}">${icon}</div><small>${label}</small><b>${val}</b></div>`;const fmt=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('fr-FR')}catch{return d}};const countRatings=()=>db.ratings.length;function go(n){page=n;nav();render();window.scrollTo({top:0,behavior:'instant'})}function nav(){$('#nav').innerHTML=NAV.map(([n,icon])=>`<button class="${page===n?'active':''}" onclick="go('${n}')" ${page===n?'aria-current="page"':''}><span class="ico">${icon}</span><span class="label">${n}</span></button>`).join('')};function chooseClass(v){currentClass=v;currentStudent=db.students.find(s=>s.classId===v)?.id||'';currentAssessment=assessmentsFor(v)[0]?.id||'';render()}function chooseStudent(v){currentStudent=v;render()}function chooseAssessment(v){currentAssessment=v;render()}
function home(){let recent=db.assessments.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);return `<section class="hero"><div><div class="eyebrow" style="color:#dfe6ff">TON STUDIO PÉDAGOGIQUE ✦</div><h2>Chaque progrès mérite une étoile !</h2><p>Évalue, accompagne et célèbre les réussites de tes élèves depuis un seul espace.</p></div><button class="btn" onclick="go('Évaluer')">★ Évaluer ma classe</button></section><div class="cards">${stat('Mes classes',db.classes.length,'▦','#4268ed','#edf1ff')}${stat('Mes élèves',db.students.length,'♙','#13b8a6','#e8faf6')}${stat('Compétences',db.skills.length,'✦','#fa776c','#fff0ee')}${stat('Évaluations saisies',countRatings(),'★','#bf8d19','#fff8df')}</div><div class="grid2">${panel('⚡ Accès rapides',`<div class="actions"><button class="btn" onclick="go('Évaluer')">★ Évaluation express</button><button class="btn mint" onclick="go('Prof principal')">♡ Suivi PP</button><button class="btn secondary" onclick="go('Bilans')">▤ Bilans</button></div><p class="hint">Un clic sur une étoile suffit pour évaluer un élève.</p>`)}${panel('📅 Dernières évaluations',recent.length?recent.map(a=>`<div class="tile"><div class="avatar">★</div><div class="tile-main"><strong>${esc(a.title)}</strong><small>${esc(cl(a.classId)?.name||'Classe')} · ${esc(sk(a.skillId)?.name||'Compétence')} · ${fmt(a.date)}</small></div></div>`).join(''):empty('Aucune évaluation'))}</div>${panel('🌈 Comment fonctionne SKILLPOP ?',`<div class="grid2"><p><strong>📚 Côté discipline</strong><br>Crée des compétences, organise des évaluations, saisis les niveaux de maîtrise et consulte l'évolution.</p><p><strong>💛 Côté professeur principal</strong><br>Rédige des observations factuelles, prépare les bilans et suis les objectifs d'accompagnement.</p></div><div class="notice">⚠️ Cette version contient uniquement des données fictives. Pour utiliser des données réelles d'élèves, une solution sécurisée et autorisée par l'établissement est nécessaire.</div>`)}`}
function classes(){return panel('▦ Mes classes',`<form class="inline" onsubmit="addClass(event)"><div class="field"><label>Nom de la classe</label><input name="name" required maxlength="70" placeholder="Ex. 3e C"></div><div class="field"><label>Discipline</label><input name="discipline" required maxlength="70" placeholder="Ex. Histoire-géographie"></div><button class="btn">+ Créer</button></form>`)+panel('📚 Toutes mes classes',db.classes.length?db.classes.map(c=>`<div class="tile"><div class="avatar">▦</div><div class="tile-main"><strong>${esc(c.name)}</strong><small>${esc(c.discipline)} · ${db.students.filter(s=>s.classId===c.id).length} élèves</small></div><button class="btn secondary" onclick="chooseClass('${c.id}');go('Élèves')">Ouvrir</button></div>`).join(''):empty('Crée ta première classe'))}
function skills(){return panel('✦ Nouvelle compétence',`<form class="inline" onsubmit="addSkill(event)"><div class="field"><label>Compétence</label><input name="name" required maxlength="120" placeholder="Ex. Comprendre un texte"></div><div class="field"><label>Discipline</label><input name="discipline" required maxlength="80" placeholder="Ex. Français"></div><div class="field"><label>Domaine</label><input name="domain" maxlength="80" placeholder="Ex. Lecture"></div><button class="btn coral">+ Ajouter</button></form>`)+panel('🌟 Référentiel de compétences',db.skills.length?db.skills.map(k=>`<div class="tile"><div class="avatar" style="background:#fff0ee;color:#f26c60">✦</div><div class="tile-main"><strong>${esc(k.name)}</strong><small>${esc(k.discipline)} · ${esc(k.domain||'Sans domaine')}</small></div><span class="badge purple">${db.assessments.filter(a=>a.skillId===k.id).length} évaluations</span></div>`).join(''):empty('Ajoute une compétence'))}
function evaluate(){let arr=assessmentsFor(currentClass),a=arr.find(x=>x.id===currentAssessment)||arr.at(-1);if(a)currentAssessment=a.id;let students=db.students.filter(s=>s.classId===currentClass);return panel('★ Évaluation express',`<div class="toolbar"><div class="field"><label>Classe</label><select onchange="chooseClass(this.value)">${options(db.classes,currentClass)}</select></div><div class="field"><label>Évaluation</label><select onchange="chooseAssessment(this.value)">${arr.map(x=>`<option value="${esc(x.id)}" ${x.id===a?.id?'selected':''}>${esc(x.title)} · ${fmt(x.date)}</option>`).join('')}</select></div></div>${a?`<p><span class="badge purple">${esc(sk(a.skillId)?.discipline||'Discipline')}</span> <strong>${esc(sk(a.skillId)?.name||'Compétence')}</strong> · ${fmt(a.date)}</p><div class="rating-legend">${['Découverte','En cours','Satisfaisant','Très bien','Expert'].map((t,i)=>`<span>★ ${i+1} · ${t}</span>`).join('')}</div><div class="scroll"><table><thead><tr><th>Élève</th><th>Maîtrise</th><th>Résultat</th></tr></thead><tbody>${students.map(s=>{let v=rating(s.id,a.id);return `<tr><td>${esc(s.name)}</td><td>${stars(v,true,s.id,a.id)}</td><td>${v?`${v}/5`:'Non évalué'}</td></tr>`}).join('')}</tbody></table></div><p class="hint">Clique à nouveau sur la dernière étoile sélectionnée pour retirer l'évaluation.</p>`:empty('Crée une évaluation ci-dessous pour commencer.')}`)+panel('➕ Préparer une évaluation',`<form class="inline" onsubmit="addAssessment(event)"><div class="field"><label>Intitulé</label><input name="title" required maxlength="120" placeholder="Ex. Lecture : chapitre 2"></div><div class="field"><label>Compétence</label><select name="skillId" required>${options(db.skills,currentSkill)}</select></div><div class="field"><label>Date</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><button class="btn mint" ${db.skills.length?'':'disabled'}>+ Créer l'évaluation</button></form><p class="hint">Une évaluation porte sur une compétence. Pour une tâche évaluant plusieurs compétences, crée plusieurs entrées associées à cette tâche.</p>`)}
function results(){let students=db.students.filter(s=>s.classId===currentClass),skillsUsed=db.skills.filter(k=>db.assessments.some(a=>a.classId===currentClass&&a.skillId===k.id));return panel('▥ Résultats par compétence',`<div class="toolbar"><label class="field">Classe<select onchange="chooseClass(this.value)">${options(db.classes,currentClass)}</select></label><button class="btn secondary" onclick="exportCSV()">↓ Exporter CSV</button></div>${students.length&&skillsUsed.length?`<div class="scroll"><table><thead><tr><th>Élève</th>${skillsUsed.map(k=>`<th>${esc(k.name)}</th>`).join('')}</tr></thead><tbody>${students.map(s=>`<tr><td>${esc(s.name)}</td>${skillsUsed.map(k=>`<td>${stars(latest(s.id,k.id))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="hint">Les étoiles indiquent le dernier niveau évalué pour chaque compétence, pas une moyenne de notes.</p>`:empty('Ajoute des élèves et des évaluations pour voir les résultats.')}`)+panel('📊 Vue d’ensemble des compétences',skillsUsed.length?skillsUsed.map(k=>{let vv=students.map(s=>latest(s.id,k.id)).filter(Boolean);let avg=vv.length?vv.reduce((a,b)=>a+b,0)/vv.length:0;return `<div class="chartrow"><strong>${esc(k.name)}</strong><div class="progress"><div style="width:${avg/5*100}%"></div></div><span>${vv.length?avg.toFixed(1)+'/5':'—'}</span></div>`}).join('')+'<p class="hint">Indicateurs descriptifs de la classe calculés sur les derniers niveaux renseignés, sans classement individuel.</p>':empty('Aucun résultat pour le moment'))}
function students(){let arr=db.students.filter(s=>s.classId===currentClass);return panel('♙ Répertoire des élèves',`<div class="toolbar"><div class="field"><label>Classe</label><select onchange="chooseClass(this.value)">${options(db.classes,currentClass)}</select></div></div><form class="inline" onsubmit="addStudent(event)"><div class="field"><label>Ajouter un élève fictif</label><input name="name" required maxlength="100" placeholder="Prénom Nom"></div><button class="btn">+ Ajouter</button></form>`)+panel('👥 Fiches individuelles',arr.length?arr.map(s=>`<div class="tile"><div class="avatar">${esc(s.name.slice(0,1).toUpperCase())}</div><div class="tile-main"><strong>${esc(s.name)}</strong><small>${db.ratings.filter(r=>r.studentId===s.id).length} résultats · ${db.notes.filter(n=>n.studentId===s.id).length} observations</small></div><button class="btn secondary" onclick="currentStudent='${s.id}';go('Prof principal')">Voir la fiche</button></div>`).join(''):empty('Aucun élève dans cette classe'))}
function pp(){let s=st(currentStudent)||db.students[0];if(s)currentStudent=s.id;let notes=db.notes.filter(n=>n.studentId===currentStudent).slice().sort((a,b)=>b.date.localeCompare(a.date));let sr=db.ratings.filter(r=>r.studentId===currentStudent);let history=sr.map(r=>({...r,a:db.assessments.find(a=>a.id===r.assessmentId)})).filter(x=>x.a).sort((a,b)=>b.a.date.localeCompare(a.a.date));return panel('♡ Espace professeur principal',`<div class="toolbar"><div class="field"><label>Élève</label><select onchange="chooseStudent(this.value)">${options(db.students,currentStudent)}</select></div><span class="badge purple">${esc(cl(s?.classId)?.name||'')}</span></div>${s?`<div class="row"><div class="avatar" style="width:60px;height:60px;font-size:26px">${esc(s.name.slice(0,1).toUpperCase())}</div><div><h2 style="margin:0">${esc(s.name)}</h2><span class="muted">${esc(cl(s.classId)?.name||'Classe')} · Dossier individuel</span></div></div><div class="tabs"><button class="${studentTab==='competences'?'active':''}" onclick="studentTab='competences';render()">✦ Compétences</button><button class="${studentTab==='notes'?'active':''}" onclick="studentTab='notes';render()">♡ Observations</button><button class="${studentTab==='history'?'active':''}" onclick="studentTab='history';render()">↗ Historique</button></div>${studentTab==='competences'?(db.skills.filter(k=>assessmentsFor(s.classId,k.id).length).map(k=>`<div class="tile"><div class="tile-main"><strong>${esc(k.name)}</strong><small>${esc(k.discipline)}</small></div>${stars(latest(s.id,k.id))}</div>`).join('')||empty('Aucune compétence évaluée')):studentTab==='history'?(history.map(r=>`<div class="tile"><div class="tile-main"><strong>${esc(r.a.title)}</strong><small>${esc(sk(r.a.skillId)?.name||'')} · ${fmt(r.a.date)}</small></div>${stars(r.value)}</div>`).join('')||empty('Aucun historique')):`<form onsubmit="addNote(event)"><div class="form-grid"><div class="field"><label>Type d’observation</label><select name="category"><option>Travail</option><option>Autonomie</option><option>Participation</option><option>Organisation</option><option>Progrès</option><option>Accompagnement</option><option>Entretien</option></select></div><div class="field"><label>Contexte</label><select name="scope"><option value="pp">Professeur principal</option><option value="discipline">Discipline</option></select></div></div><div class="field" style="margin-top:12px"><label>Observation factuelle</label><textarea name="body" required maxlength="3000" placeholder="Décris les faits, les progrès observés et les pistes d'accompagnement..."></textarea></div><button class="btn mint">+ Enregistrer l’observation</button></form><div class="sectiontitle">Observations précédentes</div>${notes.length?notes.map(n=>`<div class="note"><div class="row space"><span class="badge">${esc(n.category)}</span><small class="muted">${fmt(n.date)} · ${n.scope==='pp'?'Prof principal':'Discipline'}</small></div><p>${esc(n.body)}</p><button class="btn ghost" style="padding:6px 10px;min-height:32px;font-size:11px" onclick="deleteNote('${n.id}')">Supprimer</button></div>`).join(''):empty('Aucune observation pour cet élève')}`}`:empty('Ajoute un élève pour commencer.')}`)}
function bilans(){let arr=db.students.filter(s=>s.classId===currentClass);return panel('▤ Bilans et synthèses',`<div class="toolbar"><div class="field"><label>Classe</label><select onchange="chooseClass(this.value)">${options(db.classes,currentClass)}</select></div><div class="field"><label>Période</label><select onchange="period=this.value;render()">${db.periods.map(p=>`<option ${p===period?'selected':''}>${esc(p)}</option>`).join('')}</select></div><button class="btn secondary" onclick="exportCSV()">↓ Export CSV</button><button class="btn ghost" onclick="window.print()">⎙ Imprimer / PDF</button></div><div class="notice">Les synthèses sont descriptives : elles reprennent les niveaux de maîtrise et les observations, sans produire automatiquement de jugement sur l'élève. La période choisie est un repère d'affichage ; le filtrage par dates sera ajouté dans une version ultérieure.</div>`)+panel(`📄 Synthèse de ${esc(cl(currentClass)?.name||'classe')} · ${esc(period)}`,arr.length?arr.map(s=>{let used=db.skills.filter(k=>assessmentsFor(s.classId,k.id).length),notes=db.notes.filter(n=>n.studentId===s.id);return `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="row space"><strong>${esc(s.name)}</strong><span class="badge">${notes.length} observations</span></div><p style="font-size:13px">${used.length?used.map(k=>`${esc(k.name)} : ${latest(s.id,k.id)?latest(s.id,k.id)+'/5':'non évalué'}`).join(' · '):'Aucune compétence évaluée'}</p><p class="hint">${notes.length?'Dernière observation : '+esc(notes.at(-1).body):'Aucune observation enregistrée'}</p></div>`}).join(''):empty('Aucun élève dans cette classe'))}
function settings(){return panel('⚙ Sauvegardes et données',`<p>Les données sont conservées uniquement dans ce navigateur. Il n’y a ni compte, ni synchronisation, ni protection par mot de passe.</p><div class="actions"><button class="btn" onclick="exportJSON()">↓ Exporter une sauvegarde JSON</button><label class="btn secondary" style="cursor:pointer">↑ Importer une sauvegarde<input style="display:none" type="file" accept=".json,application/json" onchange="importJSON(event)"></label><button class="btn danger" onclick="reset()">↺ Réinitialiser la démo</button></div><p class="hint">L'import remplace toutes les données actuelles. Conserve une copie du fichier exporté.</p>`)+panel('🎨 Identité graphique',`<div class="row"><span class="badge purple">Classroom Pop</span><span class="badge">Responsive</span><span class="badge coral">by BROT2YOU</span></div><p>Palette : bleu pop, turquoise, corail, jaune étoile et lavande. Navigation tactile et présentation adaptée aux écrans mobiles.</p>`)+panel('🔒 Confidentialité',`<div class="notice"><strong>Prototype non destiné aux données nominatives réelles.</strong> Avant un déploiement en établissement : authentification, autorisations, hébergement et sauvegardes sécurisés, droits d’accès, information RGPD et validation du cadre d’utilisation.</div>`)}
function render(){const heads={'Accueil':'Bonjour ! 👋','Mes classes':'Mes classes 📚','Compétences':'Mes compétences ✦','Évaluer':'Évaluation express ★','Résultats':'Résultats & progrès 📊','Élèves':'Mes élèves 👥','Prof principal':'Suivi professeur principal 💛','Bilans':'Bilans & synthèses 📄','Paramètres':'Paramètres ⚙'};$('#heading').textContent=heads[page];$('#view').innerHTML=({'Accueil':home,'Mes classes':classes,'Compétences':skills,'Évaluer':evaluate,'Résultats':results,'Élèves':students,'Prof principal':pp,'Bilans':bilans,'Paramètres':settings}[page]||home)()}
function addClass(e){e.preventDefault();let f=new FormData(e.target);let c={id:uid(),name:String(f.get('name')).trim(),discipline:String(f.get('discipline')).trim(),year:'2026–2027'};if(!c.name||!c.discipline)return;db.classes.push(c);currentClass=c.id;save();render()};function addSkill(e){e.preventDefault();let f=new FormData(e.target);let k={id:uid(),name:String(f.get('name')).trim(),discipline:String(f.get('discipline')).trim(),domain:String(f.get('domain')).trim()};if(!k.name||!k.discipline)return;db.skills.push(k);currentSkill=k.id;save();render()};function addStudent(e){e.preventDefault();if(!cl(currentClass))return;let name=String(new FormData(e.target).get('name')).trim();if(!name)return;let s={id:uid(),name,classId:currentClass};db.students.push(s);currentStudent=s.id;save();render()};function addAssessment(e){e.preventDefault();let f=new FormData(e.target);if(!cl(currentClass)||!sk(f.get('skillId')))return;let a={id:uid(),classId:currentClass,skillId:String(f.get('skillId')),title:String(f.get('title')).trim(),date:String(f.get('date'))};if(!a.title||!/^\d{4}-\d{2}-\d{2}$/.test(a.date))return;db.assessments.push(a);currentAssessment=a.id;save();render()};function rate(s,a,v){if(!st(s)||!db.assessments.some(x=>x.id===a))return;let r=db.ratings.find(x=>x.studentId===s&&x.assessmentId===a);if(r){if(r.value===v)db.ratings=db.ratings.filter(x=>x!==r);else r.value=v}else db.ratings.push({id:uid(),studentId:s,assessmentId:a,value:v});save();render()};function addNote(e){e.preventDefault();if(!st(currentStudent))return;let f=new FormData(e.target),body=String(f.get('body')).trim();if(!body)return;db.notes.push({id:uid(),studentId:currentStudent,category:String(f.get('category')),scope:String(f.get('scope')),body,date:new Date().toISOString().slice(0,10)});save();render()};function deleteNote(id){if(!confirm('Supprimer cette observation ?'))return;db.notes=db.notes.filter(n=>n.id!==id);save();render()};function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};function exportJSON(){download('skillpop-sauvegarde.json',JSON.stringify(db,null,2),'application/json')};function exportCSV(){let arr=db.students.filter(s=>s.classId===currentClass),skillsUsed=db.skills.filter(k=>assessmentsFor(currentClass,k.id).length);let rows=[['Élève','Classe',...skillsUsed.map(k=>k.name)],...arr.map(s=>[s.name,cl(s.classId)?.name||'',...skillsUsed.map(k=>latest(s.id,k.id)||'')])];download('skillpop-resultats.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')};async function importJSON(e){let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!valid(x))throw Error('Format invalide');if(!confirm('Remplacer toutes les données par cette sauvegarde ?'))return;db=x;save();currentClass=db.classes[0]?.id||'';currentStudent=db.students[0]?.id||'';currentAssessment=db.assessments[0]?.id||'';go('Accueil')}catch{alert('Impossible de lire cette sauvegarde SKILLPOP.')}}function reset(){if(!confirm('Réinitialiser toutes les données locales et restaurer la démonstration ?'))return;db=copy(seed);save();currentClass='c1';currentStudent='s1';currentAssessment='a1';go('Accueil')};nav();render();
</script></body></html>
